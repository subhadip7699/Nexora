name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smart-contract:
    name: Smart contract
    runs-on: ubuntu-latest
    env:
      COMPACT_BACKEND: wasm
      COMPACT_VERSION: 0.31.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Install Compact compiler
        run: |
          compact update "$COMPACT_VERSION"
          compact --version
          compact compile --version

      - name: Compile Privora Compact contract
        run: npm run compile --workspace=contracts

      - name: Sync Compact artifacts
        run: npm run sync:artifacts --workspace=contracts

      - name: Test smart contract
        run: npm run test --workspace=contracts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=app

      - name: Build frontend
        run: npm run build --workspace=app

  deployment-ready:
    name: Deployment ready
    runs-on: ubuntu-latest
    needs:
      - smart-contract
      - frontend
    steps:
      - name: Mark deployment readiness
        run: echo "Contract and frontend CI passed. Vercel Git integration can deploy this commit."
